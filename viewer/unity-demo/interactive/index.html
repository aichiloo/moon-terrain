<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>月面地形 · 三维观察</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505;font:13px/1.5 "Microsoft YaHei",sans-serif;color:#fff}#view{position:relative;width:100%;height:100%;touch-action:none}canvas{display:block;width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}.hud{position:absolute;z-index:2;pointer-events:none;border:1px solid #ffffff30;border-radius:7px;background:#0009;backdrop-filter:blur(8px);padding:7px 11px}.notice{top:12px;left:12px}.gesture{right:12px;bottom:12px;font-size:12px;color:#ddd}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:3;background:#10120ff0;color:#ddd;font-size:14px;padding:20px}#loading small{display:block;margin-top:10px;color:#a4ab9b}.spinner{width:28px;height:28px;margin:0 auto 16px;border:2px solid #ffffff20;border-top-color:#d4d8c4;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.internals{display:none}#error{display:none;position:absolute;inset:0;place-content:center;padding:40px;background:#181a16;z-index:4;text-align:center;color:#eee}#retry{padding:9px 16px;border:1px solid #ddd;background:#daddcb;color:#24291e;border-radius:5px;cursor:pointer;font:inherit;margin:15px auto 0}#error-detail{color:#c4c9bc;font-size:12px;max-width:500px;word-break:break-word}
</style></head><body><div id="view"><div id="loading"><div class="spinner"></div>正在加载七类三维地形<small id="load-progress">首次载入包含地形、岩石和本地贴图</small></div><div class="hud notice">可旋转三维观察 · 浏览器渲染</div><div class="hud gesture">拖动转向 · 滚轮缩放</div><div id="error"><b>三维场景暂时无法显示</b><p id="error-detail"></p><button id="retry" onclick="location.reload()">重新加载</button></div></div>
<div class="internals" aria-hidden="true"><span id="region-label"></span><span id="mode-label"></span><span id="view-label"></span><span id="strength-label"></span><span id="layout-note"></span><span id="alt-label"></span><span id="az-label"></span><span id="selected-name"></span><span id="scale-note"></span><input id="normal" type="checkbox" checked><input id="geometry" type="checkbox" checked><input id="rocks" type="checkbox" checked><select id="layout"><option value="approved">原有</option><option value="uniform">随机</option><option value="clustered" selected>聚簇</option></select><input id="strength" value="100" type="range" min="0" max="150"><input id="sunalt" value="25" type="range" min="8" max="65"><input id="sunaz" value="135" type="range" min="0" max="360"><button id="reset">重置</button></div>
<script>window.addEventListener('error',e=>{document.getElementById('error').style.display='grid';document.getElementById('error-detail').textContent=e.message||'请返回 Unity 渲染模式继续演示';parent.postMessage({type:'lunar-error',message:e.message},'*')});</script>
<script src="shared/three.min.js"></script><script src="shared/assets.js"></script><script>window.PILOT_REGIONS={};</script>

<script src="texture_config.js"></script><script src="shared/pilot.js"></script><script src="bridge.js"></script></body></html>
